server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # DNS interne de Docker, re-résolu toutes les 10 s : si nginx démarre avant
    # le backend, « backend » n'est pas figé sur une mauvaise adresse (502).
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_upstream backend:8000;

    location /api/ {
        # Import de candidats : le backend accepte des fichiers jusqu'à 2 Mo.
        client_max_body_size 3m;
        # Envoi groupé d'emails : un lot peut prendre plus que les 60 s par défaut.
        proxy_read_timeout 120s;
        proxy_pass http://$backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Application monopage : /passer-test et les autres routes servent index.html.
    location / {
        try_files $uri /index.html;
    }
}
